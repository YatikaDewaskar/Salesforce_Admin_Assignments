<template>
    <template lwc:if={isShowModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
            
            <div class="slds-modal__header">
            <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Create Account</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium " id="modal-content-id-1">
            <div class="form-group">
            <lightning-input label="Name" name="Name" value = {accountName} onchange={handleChange} required="required" density="compact"></lightning-input>
            </div>
            <div class="form-group">
            <lightning-input label="Description" name="Description" value = {description}  onchange={handleChange} density="compact"></lightning-input>
            </div> 
            <div class="form-group">
                <lightning-input label="Phone" name="Phone" value = {phone}  onchange={handleChange} density="compact"></lightning-input>
                </div>   
            </div>
            
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleCloseAction}>Cancel</button>
              
                <button class="slds-button slds-button_brand" onclick={handleSaveAccount}>Save</button>
                <template lwc:if={isOpenCreateContact}>
                    <c-create-contact-popup account-id={selectedAccountId}></c-create-contact-popup>
                
                </template>
            </div> 
            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    
    </template>
