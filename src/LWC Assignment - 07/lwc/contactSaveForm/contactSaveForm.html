<template>
    <template lwc:if={isShowModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="modal-heading-01" class="slds-modal slds-fade-in-open slds-modal_small">
            <div class="slds-modal__container">
            <button class="slds-button slds-button_icon slds-modal__close" >
            <svg class="slds-button__icon slds-button__icon_large" aria-hidden="true">
            <use xlink:href="/assets/icons/utility-sprite/svg/symbols.svg#close"></use>
            </svg>
            <span class="slds-assistive-text">Cancel and close</span>
            </button>
            <div class="slds-modal__header">
            <h1 id="modal-heading-01" class="slds-modal__title slds-hyphenate" tabindex="-1">Create Contact</h1>
            </div>
            <div class="slds-modal__content slds-p-around_medium " id="modal-content-id-1">
            <div class="form-group">
            <lightning-input class="slds-modal__content slds-p-around_medium" label="FirstName" name="FirstName" value = {FirstName} onchange={handleChange} density="compact"></lightning-input>
            </div>
            <div class="form-group">
            <lightning-input class="slds-modal__content slds-p-around_medium" label="LastName" name="LastName" value = {LastName}  onchange={handleChange} density="compact"></lightning-input>
            <template lwc:if={isError}>
                <p>{errorMessage}</p>
            </template>  
            </div>
            <div class="form-group">
            <lightning-input class="slds-modal__content slds-p-around_medium" label="Email" name="Email" value = {Email} onchange={handleChange} density="compact"></lightning-input>
            <template lwc:if={isError}>
                <p>{errorMessage}</p>
            </template> 
            </div>
            <div class="form-group">
            <lightning-input class="slds-modal__content slds-p-around_medium" label="Phone" name="Phone" value = {Phone} onchange={handleChange} density="compact"></lightning-input>
            </div>    
            </div>
            
            <div class="slds-modal__footer">
                <button class="slds-button slds-button_neutral" onclick={handleCloseAction}>Cancel</button>
                <button class="slds-button slds-button_brand" onclick={handleSaveContact}>Save</button>
            </div> 
            </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    
    </template>
